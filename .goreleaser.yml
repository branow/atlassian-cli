version: 2

project_name: atl

builds:
  - id: unix
    main: .
    binary: atl
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/branow/atlassian-cli/cmd.version={{.Version}}

  - id: macos
    main: .
    binary: atl
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    # Signed with the release certificate; see scripts/sign.sh for what it
    # does and does not keep across upgrades. codesign needs macOS, so the
    # release runs on a macOS runner.
    hooks:
      post:
        - cmd: ./scripts/sign.sh "{{ .Path }}"
          output: true
    ldflags:
      - -s -w -X github.com/branow/atlassian-cli/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: atl
    repository:
      owner: branow
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/branow/atlassian-cli
    description: Command-line interface for Atlassian Cloud (Jira + Confluence)
    # The binaries are signed with a self-signed certificate, not notarized
    # with an Apple Developer ID, so strip the quarantine attribute Homebrew
    # puts on cask downloads; otherwise Gatekeeper refuses to run atl.
    #
    # Written as a custom_block because goreleaser's `hooks` still render the
    # `postflight do` stanza Homebrew deprecated in favour of
    # `postflight_steps` (goreleaser/goreleaser#6870).
    #
    # Inside postflight_steps the paths are declarative template tokens the
    # installer expands, NOT Ruby: `#{staged_path}` would be interpolated at
    # cask-load time against a DSL that has no such method, which makes the
    # cask unreadable. The literal {{staged_path}} is what Homebrew wants, so
    # it is wrapped in a goreleaser template string to survive goreleaser's
    # own {{...}} expansion.
    custom_block: |
      postflight_steps do
        if_path_exists "/usr/bin/xattr" do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/atl"]
        end
      end

nfpms:
  - package_name: atl
    ids: [unix]
    formats: [deb, rpm, apk]
    maintainer: Orest Bodnar <branow.code@gmail.com>
    homepage: https://github.com/branow/atlassian-cli
    description: Command-line interface for Atlassian Cloud (Jira + Confluence)
    license: MIT
    bindir: /usr/bin

scoops:
  - name: atl
    repository:
      owner: branow
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/branow/atlassian-cli
    description: Command-line interface for Atlassian Cloud (Jira + Confluence)
    license: MIT

changelog:
  use: git
