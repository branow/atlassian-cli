name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # macOS, because scripts/sign.sh signs every darwin build with codesign.
  # Linux and Windows cross-compile from here with CGO_ENABLED=0.
  goreleaser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # scripts/sign.sh refuses to run without an identity, so the certificate
      # goes into a throwaway keychain first. It is self-signed and untrusted,
      # which codesign accepts: the requirement pins the certificate itself,
      # and trust only matters to Gatekeeper.
      - name: import signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          ATL_SIGN_IDENTITY: ${{ secrets.ATL_SIGN_IDENTITY }}
